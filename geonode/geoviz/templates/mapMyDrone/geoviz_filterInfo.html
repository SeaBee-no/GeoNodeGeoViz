{% load static %}




<div class="d-flex flex-column pt-1 px-1 pb-0 w-100 bg-body-tertiary" style="height: 100%;" id="intro_filter">

  <div class="card rounded-0 p-0 m-0 mb-2">
    <div class="card-body p-0 m-0 " id="titleCard">
      <div class="row">
        
        
        
      <div class="col-6 align-self-center">
          <img width="160px" src="{% static 'mapstore/img/geonode-logo.svg' %}" class="img-fluid p-2 m-0 float-start"
            alt="seabee">
        </div> 


      

        <div class="col-6 align-self-center ">
          <a href="#" id="leftPanelClose" class="text-secondary float-end pe-2" data-bs-target="#sidebar"
            data-bs-toggle="collapse"><i class="bi bi-x-circle bi-lg"></i></a>
        </div>
      </div>
    </div>
  </div>


  <div class="w-100  text-center " style="z-index: 99;">
    <div class="hstack gap-1 w-100 justify-content-center" id="div_divTheme">
      
      <div >
        <h5 class="text-primary-emphasis small m-0 p-0">Theme filter:</h5>
      </div>
      
      <div id="divTheme" class="btn-group  ps-1 pe-1 mt-1 mb-1 w-75" role="group" aria-label="Basic radio toggle button group">
        <input type="radio" class="btn-check" name="btnradioTheme" id="inputAll" autocomplete="off" checked>
        <label class="btn btn-outline-success m-0 p-0" for="inputAll">All</label>

        <input type="radio" class="btn-check" name="btnradioTheme" id="inputSeabirs" autocomplete="off">
        <label class="btn btn-outline-success m-0 p-0" for="inputSeabirs">🦢  Seabirds</label>


        <input type="radio" class="btn-check" name="btnradioTheme" id="inputHabitat" autocomplete="off">
        <label class="btn btn-outline-success m-0 p-0" for="inputHabitat"><span>🌿</span> Habitats</label>

        <input type="radio" class="btn-check" name="btnradioTheme" id="inputMammals" autocomplete="off">
        <label class="btn btn-outline-success m-0 p-0" for="inputMammals">🐳 Mammals</label>

        <input type="radio" class="btn-check" name="btnradioTheme"  id="inputCalander" autocomplete="off">
        <label class="btn btn-outline-success m-0 p-0" for="inputCalander" >📅 Range</label>

      </div>


    </div>
  </div>

  <div class="flex-grow-1 overflow-hidden d-flex flex-column" style="min-height: 0;">
    <table id="droneList" class="table dataTableStyle table-hover table-striped"></table>
  </div>

</div>
